[build]
  publish = "."

[[redirects]]
  from = "/manage.html"
  to = "/admin.html"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/legal-terms.html"
  status = 200

[[redirects]]
  from = "/privacy-policy"
  to = "/legal-privacy.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/legal-privacy.html"
  status = 301

[[redirects]]
  from = "/release-notes"
  to = "/release-notes.html"
  status = 200
