<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Redirecting…</title></head>
<body>
<script>
  // GitHub Pages serves this for unknown paths — route /snapshot/{slug}
  // to the static snapshot page, everything else to the homepage.
  var m = location.pathname.match(/^\/snapshot\/([^/]+)\/?$/);
  location.replace(m
    ? '/snapshot.html?slug=' + encodeURIComponent(m[1]) + location.search + location.hash
    : '/');
</script>
</body>
</html>
